# M-VAVE Chocolate Plus (FootCtrlPlus): Advanced custom mode, Short = Bank A / Long = Bank B
# Mensagens: { pc = N } ou { cc = N, value = V }; ch é opcional (padrão 1).
model = "plus"
groups = 8                 # Max Group Count (1-8)
current_group = 1          # grupo ativo

[interface]
type = "expression"        # "expression" (Expression Pedal) ou "trs-midi" (TRS-MIDI)
polarity_reversal = false
codes = []                 # Expression / TRS-MIDI codes (até 16)

[group1.A]
short = [
  { cc = 69, value = 0 },
]
long = [
  { pc = 0 },
]

[group1.B]
short = [
  { pc = 1 },
]
long = []

[group1.C]
short = [
  { cc = 69, value = 2 },
]
long = [
  { cc = 3, value = 0 },
]

[group1.D]
short = [
  { cc = 69, value = 3 },
]
long = [
  { cc = 4, value = 0 },
]

